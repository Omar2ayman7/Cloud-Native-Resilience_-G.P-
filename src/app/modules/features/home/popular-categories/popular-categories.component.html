<section class="py-10 bg-white border-y border-gray-100">
    <div class="container">
        <p class="text-green-600 font-semibold text-sm uppercase tracking-wider">Browse by type</p>
        <h2 class="section-title mt-1">Shop Popular Categories</h2>
        <owl-carousel-o [options]="categoriesOptions">
            @for (category of categoriesList(); track category._id) {
                <ng-template carouselSlide [id]="category._id">
                    <div class="mx-2 bg-white border border-gray-200 rounded-2xl p-3 hover:shadow-md hover:border-green-200 transition">
                        <img [src]="category.image" class="w-full h-[220px] object-cover rounded-xl" [alt]="category.name">
                        <h3 class="mt-3 font-semibold text-gray-800 text-center">{{ category.name }}</h3>
                    </div>
                </ng-template>
            }
        </owl-carousel-o>
    </div>
</section>
