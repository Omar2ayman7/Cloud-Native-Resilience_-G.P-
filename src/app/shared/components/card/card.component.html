<div class="card overflow-hidden group/card h-full flex flex-col">
    <div class="cursor-pointer flex-1" [routerLink]="['/details', product.slug, product._id]">
        <div class="bg-gray-50 rounded-xl overflow-hidden mb-3">
            <img [src]="product.imageCover" [alt]="product.title" class="w-full h-[250px] object-contain p-3 transition-transform duration-300 group-hover/card:scale-105">
        </div>
        <h3 class="text-xs font-semibold uppercase tracking-wide text-green-700 mb-1">{{ product.category.name }}</h3>
        <h4 class="text-base font-semibold text-gray-900 min-h-12">{{ product.title.split(' ',3).join(' ') }}</h4>
        <div class="flex justify-between items-center mt-3 mb-4">
            <span class="font-bold text-gray-900">{{ product.price }} EGP</span>
            <span class="text-sm text-gray-600"><i class="fas fa-star text-yellow-500 me-1"></i>{{ product.ratingsAverage }}</span>
        </div>
    </div>
    <button (click)="addProductToCart(product._id)" class="btn">Add to cart</button>
</div>
